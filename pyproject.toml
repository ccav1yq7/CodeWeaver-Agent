[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codeweaver-agent"
version = "1.0.0a1"
description = "A terminal coding agent with explicit capabilities and replayable sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Gao Yuqi"}]
dependencies = ["openai>=1.68", "anthropic>=0.49", "pydantic>=2.10", "jsonschema>=4.23"]

[project.optional-dependencies]
tui = ["textual>=2.1"]
remote = ["aiohttp>=3.11"]
mcp = ["mcp>=1.12,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11", "aiohttp>=3.11"]

[project.scripts]
codeweaver = "codeweaver.cli:main"
codeweaver-eval = "codeweaver.evaluation:main"

[project.urls]
Repository = "https://github.com/ccav1yq7/CodeWeaver-Agent"
Issues = "https://github.com/ccav1yq7/CodeWeaver-Agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codeweaver"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "examples/", "README.md", "LICENSE", "PROVENANCE.md", "SECURITY.md", "CHANGELOG.md", "CONTRIBUTING.md", "pyproject.toml", "uv.lock", ".gitignore", ".github/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
